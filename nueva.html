<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Carol — Carta Nueva</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2764.png" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #0a0800;
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
        overflow-x: hidden;
      }

      #starCanvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 650px;
        margin: 0 auto;
        padding: 60px 24px 80px;
      }

      .header {
        text-align: center;
        margin-bottom: 50px;
        animation: fadeDown 1.2s ease-out;
      }

      .header-tag {
        display: inline-block;
        font-size: 0.7rem;
        color: #f59e0b;
        border: 1px solid rgba(245,158,11,0.35);
        border-radius: 20px;
        padding: 4px 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        font-family: 'Dancing Script', cursive;
        color: #fcd34d;
        font-size: 3.2rem;
        text-shadow: 0 0 30px rgba(245,158,11,0.35);
        margin-bottom: 10px;
        line-height: 1.1;
      }

      .header-sub {
        font-size: 0.8rem;
        color: #78695a;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .header-divider {
        width: 60px;
        height: 1px;
        background: rgba(245,158,11,0.3);
        margin: 0 auto;
      }

      .carta-container {
        background: rgba(245,158,11,0.03);
        border: 1px solid rgba(245,158,11,0.1);
        border-left: 2px solid rgba(245,158,11,0.4);
        border-radius: 0 20px 20px 0;
        padding: 30px 28px;
        margin-bottom: 50px;
        animation: fadeUp 1.4s ease-out;
      }

      #carta-escrita {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        line-height: 1.75;
        color: #d4c5a9;
        font-style: italic;
        display: inline;
      }

      .cursor {
        font-size: 1.1rem;
        color: #f59e0b;
        font-weight: bold;
        animation: parpadeo 0.8s infinite;
      }

      @keyframes parpadeo {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .respuesta-seccion {
        opacity: 0;
        transition: opacity 1.5s ease-in;
        margin-top: 20px;
      }

      .respuesta-seccion.visible {
        opacity: 1;
      }

      .respuesta-header {
        text-align: center;
        margin-bottom: 24px;
      }

      .respuesta-titulo {
        font-family: 'Dancing Script', cursive;
        color: #fcd34d;
        font-size: 1.8rem;
        margin-bottom: 6px;
      }

      .respuesta-sub {
        font-size: 0.8rem;
        color: #78695a;
        font-style: italic;
      }

      .form-card {
        background: rgba(245,158,11,0.04);
        border: 1px solid rgba(245,158,11,0.15);
        border-radius: 20px;
        padding: 28px 24px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-label {
        display: block;
        font-size: 0.75rem;
        color: #92836a;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .form-input {
        width: 100%;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(245,158,11,0.15);
        border-radius: 12px;
        padding: 12px 16px;
        color: #f1f5f9;
        font-size: 0.9rem;
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s;
      }

      .form-input:focus {
        outline: none;
        border-color: rgba(245,158,11,0.4);
      }

      .form-input::placeholder {
        color: #4a3f2f;
      }

      textarea.form-input {
        resize: none;
        height: 130px;
        line-height: 1.6;
      }

      .form-btn {
        width: 100%;
        padding: 14px;
        background: rgba(245,158,11,0.1);
        border: 1px solid rgba(245,158,11,0.3);
        border-radius: 14px;
        color: #f59e0b;
        font-size: 0.95rem;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: background 0.2s, transform 0.15s;
        margin-top: 8px;
      }

      .form-btn:hover {
        background: rgba(245,158,11,0.16);
        transform: translateY(-1px);
      }

      .form-btn:active { transform: translateY(0); }

      .form-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .success-msg {
        display: none;
        text-align: center;
        padding: 24px;
        background: rgba(245,158,11,0.06);
        border: 1px solid rgba(245,158,11,0.2);
        border-radius: 16px;
        margin-top: 16px;
      }

      .success-msg.visible { display: block; }

      .success-icon { font-size: 2rem; margin-bottom: 10px; }

      .success-text {
        font-family: 'Dancing Script', cursive;
        color: #fcd34d;
        font-size: 1.4rem;
        margin-bottom: 6px;
      }

      .success-sub {
        font-size: 0.8rem;
        color: #78695a;
        font-style: italic;
      }

      footer {
        text-align: center;
        padding: 60px 20px 40px;
        position: relative;
        z-index: 1;
      }

      .footer-firma {
        font-family: 'Dancing Script', cursive;
        font-size: 2rem;
        color: rgba(245,158,11,0.35);
        margin-bottom: 16px;
      }

      .back-btn {
        display: inline-block;
        font-size: 0.8rem;
        color: #78695a;
        border: 1px solid rgba(245,158,11,0.15);
        border-radius: 20px;
        padding: 8px 20px;
        text-decoration: none;
        letter-spacing: 1px;
        transition: all 0.2s;
      }

      .back-btn:hover {
        color: #f59e0b;
        border-color: rgba(245,158,11,0.35);
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 480px) {
        h1 { font-size: 2.4rem; }
        .page { padding: 40px 18px 60px; }
        .carta-container { padding: 22px 18px; }
        .form-card { padding: 20px 16px; }
      }
    </style>
  </head>
  <body>

    <canvas id="starCanvas"></canvas>

    <div class="page">

      <div class="header">
        <div class="header-tag">✦ Para Carol ✦</div>
        <h1>Con todo mi amor...</h1>
        <p class="header-sub">Un nuevo capítulo para ti</p>
        <div class="header-divider"></div>
      </div>

      <div class="carta-container">
        <p id="carta-escrita"></p>
        <span class="cursor">|</span>
      </div>

      <div class="respuesta-seccion" id="respuesta-seccion">
        <div class="respuesta-header">
          <div class="respuesta-titulo">¿Quieres dejarme un mensaje? 💌</div>
          <div class="respuesta-sub">Solo tú y yo lo sabremos</div>
        </div>

        <div class="form-card">
          <form id="form-respuesta" action="https://formspree.io/f/mpqerwel" method="POST">
            <div class="form-group">
              <label class="form-label" for="nombre">Tu nombre</label>
              <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Carol..." />
            </div>
            <div class="form-group">
              <label class="form-label" for="mensaje">Tu mensaje</label>
              <textarea class="form-input" id="mensaje" name="mensaje" placeholder="Escríbeme lo que quieras..."></textarea>
            </div>
            <button class="form-btn" type="submit" id="btn-enviar">Enviar mensaje ✦</button>
          </form>

          <div class="success-msg" id="success-msg">
            <div class="success-icon">✨</div>
            <div class="success-text">¡Mensaje enviado!</div>
            <div class="success-sub">Johan lo recibirá con todo el amor que le pusiste.</div>
          </div>
        </div>
      </div>

    </div>

    <footer>
      <div class="footer-firma">Con cariño, Johan</div>
      <a class="back-btn" href="index.html">← Volver al inicio</a>
    </footer>

    <script>
      /* === ESTRELLAS DORADAS === */
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.2,
        a: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.004,
        gold: Math.random() > 0.5
      }));

      function drawStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.a += s.speed;
          const alpha = (Math.sin(s.a) + 1) / 2 * 0.9;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.gold
            ? `rgba(245,158,11,${alpha})`
            : `rgba(255,255,255,${alpha * 0.6})`;
          ctx.fill();
        });
        requestAnimationFrame(drawStars);
      }
      drawStars();

      /* === MÁQUINA DE ESCRIBIR === */
      const textoCarta = "Hola Carol.\n\n\nAquí va el texto de tu carta nueva. Reemplaza este contenido con lo que quieras decirle.\n\n\nEste es solo un ejemplo para que veas cómo se ve el efecto de máquina de escribir con el estilo dorado.\n\n\nAtt: El chico que más te ama en este universo...";

      const elementoTexto = document.getElementById('carta-escrita');
      let indice = 0;

      function escribirCarta() {
        if (indice < textoCarta.length) {
          if (textoCarta.charAt(indice) === '\n') {
            elementoTexto.innerHTML += '<br>';
          } else {
            elementoTexto.appendChild(document.createTextNode(textoCarta.charAt(indice)));
          }
          indice++;
          setTimeout(escribirCarta, 40);
        } else {
          setTimeout(() => {
            document.querySelector('.cursor').style.display = 'none';
            document.getElementById('respuesta-seccion').classList.add('visible');
          }, 1500);
        }
      }

      window.addEventListener('load', () => {
        setTimeout(escribirCarta, 1000);
      });

      /* === FORMULARIO === */
      const form = document.getElementById('form-respuesta');
      const btnEnviar = document.getElementById('btn-enviar');
      const successMsg = document.getElementById('success-msg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando...';

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          });

          if (response.ok) {
            form.style.display = 'none';
            successMsg.classList.add('visible');
          } else {
            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Enviar mensaje ✦';
            alert('Hubo un problema al enviar. Intenta de nuevo.');
          }
        } catch (err) {
          btnEnviar.disabled = false;
          btnEnviar.textContent = 'Enviar mensaje ✦';
          alert('Hubo un problema al enviar. Intenta de nuevo.');
        }
      });
    </script>

  </body>
</html>
