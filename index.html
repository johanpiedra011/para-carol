<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Carol</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2764.png" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #0f172a;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
      }

      .bg-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -60%);
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(239,68,68,0.1) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        text-align: center;
        animation: fadeIn 1.2s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .heading {
        font-family: 'Dancing Script', cursive;
        color: #ef4444;
        font-size: 2.8rem;
        text-shadow: 0 0 30px rgba(239,68,68,0.35);
        margin-bottom: 6px;
      }

      .subheading {
        font-size: 0.75rem;
        color: #94a3b8;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .contador-label {
        font-size: 0.8rem;
        color: #64748b;
        font-style: italic;
        margin-bottom: 10px;
      }

      .contador {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 28px;
        padding: 14px 20px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(239,68,68,0.15);
        border-radius: 16px;
        backdrop-filter: blur(10px);
      }

      .c-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 48px;
      }

      .c-num {
        font-size: 1.6rem;
        font-weight: 800;
        color: #ef4444;
        text-shadow: 0 0 10px rgba(239,68,68,0.3);
        line-height: 1;
      }

      .c-lbl {
        font-size: 0.6rem;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 4px;
      }

      .c-sep {
        color: rgba(239,68,68,0.3);
        font-size: 1.6rem;
        font-weight: 800;
        align-self: flex-start;
        margin-top: 1px;
      }

      .cartas {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .carta-btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(239,68,68,0.2);
        border-radius: 16px;
        padding: 18px 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        text-decoration: none;
        transition: border-color 0.2s, background 0.2s, transform 0.15s;
      }

      .carta-btn:hover {
        border-color: rgba(239,68,68,0.5);
        background: rgba(239,68,68,0.07);
        transform: translateY(-2px);
      }

      .carta-btn:active {
        transform: translateY(0);
      }

      .btn-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }

      .btn-text { flex: 1; }

      .btn-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 3px;
      }

      .btn-desc {
        font-size: 0.75rem;
        color: #64748b;
      }

      .btn-arrow {
        color: rgba(239,68,68,0.4);
        font-size: 1.3rem;
        flex-shrink: 0;
      }

      .firma {
        margin-top: 28px;
        font-family: 'Dancing Script', cursive;
        font-size: 1.4rem;
        color: rgba(239,68,68,0.4);
      }

      @media (max-width: 480px) {
        .heading { font-size: 2.2rem; }
        .c-num { font-size: 1.3rem; }
        .c-unit { min-width: 38px; }
      }
    </style>
  </head>
  <body>

    <div class="bg-glow"></div>

    <div class="container">
      <h1 class="heading">Para Carol 🤍</h1>
      <p class="subheading">Un pequeño detalle, para toda la vida</p>

      <p class="contador-label">Desde aquel 21 de Agosto de 2022...</p>
      <div class="contador">
        <div class="c-unit">
          <span class="c-num" id="dias">0</span>
          <span class="c-lbl">Días</span>
        </div>
        <div class="c-sep">:</div>
        <div class="c-unit">
          <span class="c-num" id="horas">00</span>
          <span class="c-lbl">Hrs</span>
        </div>
        <div class="c-sep">:</div>
        <div class="c-unit">
          <span class="c-num" id="minutos">00</span>
          <span class="c-lbl">Min</span>
        </div>
        <div class="c-sep">:</div>
        <div class="c-unit">
          <span class="c-num" id="segundos">00</span>
          <span class="c-lbl">Seg</span>
        </div>
      </div>

      <div class="cartas">
        <a class="carta-btn" href="cumple.html">
          <div class="btn-icon">🎂</div>
          <div class="btn-text">
            <div class="btn-name">Carta Cumpleaños</div>
            <div class="btn-desc">Tu primera carta especial</div>
          </div>
          <div class="btn-arrow">›</div>
        </a>

        <a class="carta-btn" href="nueva.html">
          <div class="btn-icon">💌</div>
          <div class="btn-text">
            <div class="btn-name">Carta Nueva</div>
            <div class="btn-desc">Un nuevo capítulo para ti</div>
          </div>
          <div class="btn-arrow">›</div>
        </a>
      </div>

      <p class="firma">Con cariño, Johan</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
      /* --- CONTADOR --- */
      const fechaInicio = new Date(2022, 10, 21, 0, 0, 0);

      function actualizar() {
        const ahora = new Date();
        const diff = ahora - fechaInicio;

        const dias     = Math.floor(diff / (1000 * 60 * 60 * 24));
        const horas    = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos  = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('dias').textContent     = dias;
        document.getElementById('horas').textContent    = String(horas).padStart(2, '0');
        document.getElementById('minutos').textContent  = String(minutos).padStart(2, '0');
        document.getElementById('segundos').textContent = String(segundos).padStart(2, '0');
      }

      actualizar();
      setInterval(actualizar, 1000);

      /* --- NOTIFICACIÓN EMAILJS --- */
      emailjs.init("XXLuwTQsTQLyCMvK7");

      window.addEventListener("load", function () {
        const hora = new Date().toLocaleString("es-CO", {
          timeZone: "America/Bogota",
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

        emailjs.send("respuesta_carta", "template_9gizfaa", {
          hora: hora,
        });
      });
    </script>

  </body>
</html>
